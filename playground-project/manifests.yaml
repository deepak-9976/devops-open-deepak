apiVersion: v1
data:
  .dockerconfigjson: <private key token encrypted>
kind: Secret
metadata:
  name: private-reg-cred
type: kubernetes.io/dockerconfigjson

---
apiVersion: apps/v1
kind: Deployment 
metadata:
  name: playground-sample-project
spec:
  selector:
    matchLabels:
      app: playground-sample-project
  replicas: 1
  template:
    metadata:
      labels:
        app: playground-sample-project
    spec:
      imagePullSecrets: 
      - name: private-reg-cred
      containers:
        - name: playground-sample-project
          image: docker.io/deepak9976/playground-image:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080 

---
apiVersion: v1
kind: Service 
metadata: 
  name: playground-sample-project-svc
spec:
  type: NodePort
  selector:
    app: playground-sample-project
  ports:
    - port: 8080 
      targetPort: 8080
